name: Weekly scheme refresh

# Re-scrapes myscheme.gov.in and re-ingests the corpus every Monday (report §1.2:
# "refreshed on a schedule"), or on demand from the Actions tab. Upserts are keyed
# on each scheme's source URL, so re-runs never duplicate rows (FR-09).
# Needs the repository secret HAQDAAR_DATABASE_URL pointing at a database GitHub
# can reach (for example Supabase).
on:
  schedule:
    - cron: "30 21 * * 0" # Monday 03:00 IST
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run build

      # The raw cache is kept between runs so an interrupted run can resume; scheme pages
      # older than 6 days are always fetched again, so each weekly run picks up edits.
      - uses: actions/cache@v4
        with:
          path: data/myscheme/raw
          key: myscheme-raw-${{ github.run_id }}
          restore-keys: myscheme-raw-

      - name: Scrape myscheme.gov.in and ingest
        run: node dist/cli.js refresh --triggered-by github-actions
        env:
          HAQDAAR_DATABASE_URL: ${{ secrets.HAQDAAR_DATABASE_URL }}
