# Local PostgreSQL for Haqdaar.ai. The API applies its own migrations on start
# (apps/api/db/migrations), so the database only needs to exist.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haqdaar
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports: ["5432:5432"]
    volumes:
      - haqdaar_pg:/var/lib/postgresql/data
volumes:
  haqdaar_pg:
